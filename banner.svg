<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6FAE9C"/>
      <stop offset="50%" stop-color="#EDEAE3"/>
      <stop offset="100%" stop-color="#6FAE9C"/>
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6FAE9C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6FAE9C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="200" fill="#0f2e27"/>
  <circle cx="450" cy="100" r="180" fill="url(#glow)">
    <animate attributeName="r" values="150;190;150" dur="4s" repeatCount="indefinite"/>
  </circle>

  <text x="50%" y="42%" text-anchor="middle" font-family="Fira Code, monospace"
        font-size="44" font-weight="700" fill="#EDEAE3" letter-spacing="4">
    RAGHAV GUPTA
  </text>

  <rect x="300" y="122" width="300" height="4" rx="2" fill="url(#shimmer)"/>

  <circle cx="330" cy="150" r="4" fill="#6FAE9C">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="150" r="4" fill="#EDEAE3">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="570" cy="150" r="4" fill="#6FAE9C">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
</svg>
