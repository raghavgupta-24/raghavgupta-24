<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#66FF99" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#66FF99" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineshimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#66FF99" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#EDEAE3"/>
      <stop offset="100%" stop-color="#66FF99" stop-opacity="0.3"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" fill="#0a0f0c"/>

  <circle cx="450" cy="100" r="160" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s"
             calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="38" font-weight="600" fill="#EDEAE3" letter-spacing="6">
    RAGHAV GUPTA
  </text>

  <text x="450" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="13" fill="#8fae9d" letter-spacing="2">
    building quietly, shipping loud
  </text>

  <rect x="420" y="140" width="60" height="1.5" fill="url(#lineshimmer)"/>
</svg>
